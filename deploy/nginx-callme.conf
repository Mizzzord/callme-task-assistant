# Шаблон: используйте только после выпуска сертификата для домена.
server {
    listen 80;
    server_name callme.s2k.studio;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name callme.s2k.studio;
    ssl_certificate /etc/letsencrypt/live/callme.s2k.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/callme.s2k.studio/privkey.pem;
    client_max_body_size 11m;

    location = /api/yandex/callback {
        access_log off;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3001;
    }
    location / {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3001;
    }
}
